# CI del lado WEB — Fase 10.
# Qué defiende: la tipografía de contratos con la API (eslint + tsc) y que el
# build de producción Next siga compilando (incluye las fuentes de Google).

name: CI web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: eslint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build de producción (Next + TypeScript)
        run: npm run build
