# Desarrollo local — ANALIZADOR DEPORTIVO
# Estado actual (Fase 1): solo la base de datos.
# El servicio "db" duplica lo que será Neon en producción → la misma Postgres
# en local y en la nube evita sorpresas al desplegar (Fase 11).
#
# Uso:   docker compose up -d db api      (api = FastAPI, Fase 8)
# Stop:  docker compose down          (los datos persisten en el volumen pgdata)
# Borrar datos: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    container_name: analizador_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: analizador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}   # solo local, no es secreto de producción
      POSTGRES_DB: analizador
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analizador -d analizador"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: analizador_api
    restart: unless-stopped
    environment:
      # host "db" = DNS interno de la red de compose (no localhost)
      DATABASE_URL: postgresql+psycopg://analizador:${POSTGRES_PASSWORD:-devpassword}@db:5432/analizador
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Fase 11 (deploy) ──────────────────────────────────
  # web: Next.js — producción en Vercel; el contenedor web se agrega ahí
  # (dev local: cd web && npm run dev → http://localhost:3000).

volumes:
  pgdata:
